<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080b" />
    <title>MIXER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="radio-shell">
      <div class="art-background" id="artBackground" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar">
        <img draggable="false" class="logo logo-header" src="/assets/mixer.png" alt="MIXER" />
        <div class="top-actions">
          <button class="top-action" id="historyButton" type="button"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i><span>HISTORY</span></button>
          <button class="top-action" id="requestButton" type="button"><i class="fa-solid fa-music" aria-hidden="true"></i><span>REQUEST</span></button>
        </div>
      </header>

      <section class="player" aria-labelledby="stationName">
        <img draggable="false" class="logo logo-main" id="stationName" src="/assets/m.png" alt="MIXER" />

        <div class="cover-wrap" id="coverWrap">
          <img draggable="false" id="coverArt" />
          <img draggable="false" id="coverArtNext" alt="" aria-hidden="true" />
          <div class="cover-fallback" id="coverFallback" aria-hidden="true"></div>
        </div>

        <div class="track-info">
          <p class="on-air" id="onAir">ON AIR · AUTODJ</p>
          <h2 id="songTitle">Loading the next tune…</h2>
          <p id="artistName">MIXER Radio</p>
        </div>

        <div class="control-deck">
          <button class="play-button" id="playButton" type="button" aria-label="Play MIXER live radio">
            <i id="playIcon" class="fa-solid fa-play" aria-hidden="true"></i>
          </button>
          <div class="volume-control">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.1-3.8v7.6a4.5 4.5 0 0 0 2.1-3.8Zm0-8.5v2.1a7.5 7.5 0 0 1 0 12.8v2.1a9.5 9.5 0 0 0 0-16.9Z" /></svg>
            <label class="sr-only" for="volumeSlider">Volume</label>
            <input id="volumeSlider" type="range" min="0" max="100" value="80" aria-label="Volume" />
          </div>
        </div>
      </section>

      <footer>
        <span>LIVE FROM THE MIXER</span>
        <span id="listenerCount">— LISTENING</span>
        <span>192 KBPS MP3</span>
      </footer>
    </main>

    <audio id="radioAudio" preload="none" src="https://azuracast.aidanbray.com/listen/mixer/radio.mp3"></audio>
    <dialog class="panel" id="historyPanel" aria-labelledby="historyHeading">
      <div class="panel-header"><div><p>RECENTLY PLAYED</p><h2 id="historyHeading">Song history</h2></div><button class="panel-close" type="button" aria-label="Close history">×</button></div>
      <div class="history-list" id="historyList" aria-live="polite"><p>Loading history…</p></div>
    </dialog>
    <dialog class="panel" id="requestPanel" aria-labelledby="requestHeading">
      <div class="panel-header"><div><p>SONG REQUESTS</p><h2 id="requestHeading">Make a request</h2></div><button class="panel-close" type="button" aria-label="Close requests">×</button></div>
      <div class="request-message" id="requestMessage">Choose a song to add to the request queue.</div>
      <div class="request-search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><label class="sr-only" for="requestSearch">Search available requests</label><input id="requestSearch" type="search" placeholder="Search songs or artists" autocomplete="off" /></div>
      <div class="request-list" id="requestList" aria-live="polite"><p>Loading requests…</p></div>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
